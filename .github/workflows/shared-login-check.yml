name: Shared TMS WMS login
on:
  pull_request:
    branches: [master, feature/warehouse-wms-portal]
    paths:
      - 'src/app/login/page.tsx'
      - 'src/lib/login-system.ts'
      - 'scripts/test-login-system.cjs'
      - '.github/workflows/shared-login-check.yml'
  push:
    branches: [feature/warehouse-wms-portal]
    paths:
      - 'src/app/login/page.tsx'
      - 'src/lib/login-system.ts'
      - 'scripts/test-login-system.cjs'
      - '.github/workflows/shared-login-check.yml'
permissions:
  contents: read
jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/test-login-system.cjs
