name: WMS production access check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: wms-production
    steps:
      - name: Verify access to dedicated WMS production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.WMS_SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is unavailable in the existing WMS environment."
            exit 1
          fi
          code=$(curl --silent --show-error --output /tmp/wms-project.json --write-out '%{http_code}' --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" https://api.supabase.com/v1/projects/glecgvomkaqmkfkhtxhi)
          if [ "$code" != "200" ]; then
            echo "::error::WMS project access check returned HTTP $code. No database changes were attempted."
            exit 1
          fi
          jq -e '.id == "glecgvomkaqmkfkhtxhi"' /tmp/wms-project.json > /dev/null
          jq '{id, name, region, status}' /tmp/wms-project.json >> "$GITHUB_STEP_SUMMARY"
          echo "Verified dedicated WMS production project. No schema or data changes." >> "$GITHUB_STEP_SUMMARY"
