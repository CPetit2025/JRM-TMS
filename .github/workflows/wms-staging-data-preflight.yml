name: WMS legacy data preflight (metadata only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    environment: wms-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated WMS metadata without TMS credentials or row exports
        run: node scripts/wms-environment-audit.cjs
        env:
          AUDIT_TARGET: staging
          WMS_SUPABASE_ACCESS_TOKEN: ${{ secrets.WMS_SUPABASE_ACCESS_TOKEN }}
          WMS_SUPABASE_DB_PASSWORD: ${{ secrets.WMS_SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          WMS_VERCEL_TOKEN: ${{ secrets.WMS_VERCEL_TOKEN }}
          WMS_VERCEL_PROJECT_ID: ${{ vars.WMS_VERCEL_PROJECT_ID }}
          WMS_VERCEL_ORG_ID: ${{ vars.WMS_VERCEL_ORG_ID }}
