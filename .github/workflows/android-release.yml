name: Build signed Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Android version name
        required: true
        default: '1.0.4'
      version_code:
        description: Android version code (must increase)
        required: true
        default: '5'
      publish:
        description: Publicar el APK (descarga del login y aviso de actualización en el app)
        type: boolean
        default: true
      release_notes:
        description: Novedades que verá el conductor
        required: false
        default: 'Micrófono habilitado para mensajes de voz del Copiloto IA y audio de fallas.'

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - name: Restore signing key
        env:
          JRM_RELEASE_KEYSTORE_BASE64: ${{ secrets.JRM_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$JRM_RELEASE_KEYSTORE_BASE64"
          mkdir -p artifacts/android/signing
          printf '%s' "$JRM_RELEASE_KEYSTORE_BASE64" | base64 --decode > artifacts/android/signing/jrm-tms-release.p12
      - name: Build and verify APK
        env:
          JRM_KEYSTORE_PATH: ${{ github.workspace }}/artifacts/android/signing/jrm-tms-release.p12
          JRM_KEYSTORE_PASSWORD: ${{ secrets.JRM_KEYSTORE_PASSWORD }}
          JRM_KEY_ALIAS: jrm-tms-release
          JRM_KEY_PASSWORD: ${{ secrets.JRM_KEY_PASSWORD }}
          JRM_ANDROID_VERSION_NAME: ${{ inputs.version_name }}
          JRM_ANDROID_VERSION_CODE: ${{ inputs.version_code }}
        run: npm run build:apk
      - uses: supabase/setup-cli@v1
        if: ${{ inputs.publish }}
        with:
          version: latest
      # Sube el APK al bucket público de instaladores y registra la versión en app_versions (scripts/publish-apk.cjs).
      # La clave de servicio se obtiene con el token de Supabase ya cargado; no se imprime (add-mask).
      - name: Publish APK
        if: ${{ inputs.publish }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          JRM_ANDROID_VERSION_NAME: ${{ inputs.version_name }}
          JRM_ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          JRM_ANDROID_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$SUPABASE_PROJECT_ID"
          KEY=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_ID" -o json | jq -r '[.[] | select(.name == "service_role")][0].api_key // empty')
          test -n "$KEY" || { echo "::error::No se obtuvo la clave de servicio de Supabase"; exit 1; }
          echo "::add-mask::$KEY"
          NEXT_PUBLIC_SUPABASE_URL="https://$SUPABASE_PROJECT_ID.supabase.co" SUPABASE_SERVICE_ROLE_KEY="$KEY" node scripts/publish-apk.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: jrm-tms-android-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            artifacts/android/*.apk
            artifacts/android/*.sha256
          if-no-files-found: error
          retention-days: 90
