name: WMS staging legacy target check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: wms-staging
    steps:
      - uses: actions/checkout@v4
      - name: Verify staging identity only
        env:
          JRM_APP: wms-staging
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: node scripts/check-supabase-target.cjs
      - run: echo 'This legacy workflow does not migrate. Use Deploy WMS with a frozen candidate SHA and its complete preflight.'
