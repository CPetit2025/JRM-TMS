name: WMS staging database

on:
  push:
    branches: [feature/warehouse-wms-portal]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/wms-staging-db.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wms-staging-database
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/feature/warehouse-wms-portal'
    runs-on: ubuntu-latest
    environment: wms-staging
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Guard target project and branch
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          test "$GITHUB_REF" = "refs/heads/feature/warehouse-wms-portal"
          test "$PROJECT_REF" = "rquujukgtturdlkuzgdc"

      - name: Link staging only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"

      - name: Preview all pending schema migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked --include-all --dry-run --yes

      - name: Apply schema migrations to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked --include-all --yes
