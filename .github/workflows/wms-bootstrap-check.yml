name: WMS standalone database
on:
  pull_request:
    branches: [master, feature/warehouse-wms-portal]
    paths: ['wms-db/**', 'scripts/test-wms-bootstrap.cjs', '.github/workflows/wms-bootstrap-check.yml']
  push:
    branches: [feature/warehouse-wms-portal]
    paths: ['wms-db/**', 'scripts/test-wms-bootstrap.cjs', '.github/workflows/wms-bootstrap-check.yml']
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/test-wms-bootstrap.cjs
      - run: node scripts/test-wms-isolation.mjs
