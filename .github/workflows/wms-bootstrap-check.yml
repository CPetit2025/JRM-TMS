name: WMS standalone database
on:
  pull_request:
    branches: [master, feature/warehouse-wms-portal]
    paths: ['wms-db/**', 'src/lib/update-status.ts', 'scripts/test-update-status.cjs', 'scripts/test-wms-bootstrap.cjs', 'scripts/test-wms-picking.cjs', 'scripts/test-wms-erp-stock.cjs', 'scripts/test-wms-inventario.cjs', 'scripts/test-wms-modelo-apt.cjs', 'scripts/test-register-driver-build.cjs', 'src/app/api/register-driver/route.ts', '.github/workflows/wms-bootstrap-check.yml']
  push:
    branches: [feature/warehouse-wms-portal]
    paths: ['wms-db/**', 'src/lib/update-status.ts', 'scripts/test-update-status.cjs', 'scripts/test-wms-bootstrap.cjs', 'scripts/test-wms-picking.cjs', 'scripts/test-wms-erp-stock.cjs', 'scripts/test-wms-inventario.cjs', 'scripts/test-wms-modelo-apt.cjs', 'scripts/test-register-driver-build.cjs', 'src/app/api/register-driver/route.ts', '.github/workflows/wms-bootstrap-check.yml']
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/test-wms-bootstrap.cjs
      - run: node scripts/test-wms-picking.cjs
      - run: node scripts/test-wms-erp-stock.cjs
      - run: node scripts/test-wms-inventario.cjs
      - run: node scripts/test-wms-modelo-apt.cjs
      - run: node scripts/test-update-status.cjs
      - run: node scripts/test-wms-isolation.mjs
      - run: node --test scripts/test-register-driver-build.cjs
