name: Verificación previa (PR)

# Corre en cada PR hacia master y debe estar en verde antes de mergear (CLAUDE.md → Despliegue):
# config del APK (server.url), accesos del app del conductor (scripts/check-release-guards.cjs) y tipos (tsc).

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guardas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/test-tracking-email.cjs
      - run: node scripts/test-hhee.cjs
      - run: node scripts/test-gestion-personal.cjs
      - run: node --test scripts/test-gestion-personal-ui.cjs
      - run: node --test scripts/test-hhee-worker-search.cjs
      - run: node scripts/test-route-operations.cjs
      - run: node scripts/test-forklift-stop.cjs
      - run: node scripts/test-tower-route-crew.cjs
      - run: node --test scripts/test-tower-detail-ui.cjs
      - run: node scripts/test-manual-operational-close.cjs
      - run: node --test scripts/test-route-operations-ui.cjs
      - run: node scripts/test-hhee-postgres.cjs
      - run: node scripts/test-hhee-route-accumulation.cjs
      - run: node scripts/test-tracking-calendar.mjs
      - run: node scripts/test-tracking-family-sql.cjs
      - run: node scripts/test-kpi-review.cjs
      - run: node scripts/test-analytics.cjs
      - run: node scripts/test-app-session.cjs
      - run: node scripts/test-apt-upload.cjs
      - run: node scripts/test-inventario-parse.cjs
      - run: node scripts/test-erp-parse.cjs
      - run: node scripts/test-erp-reference.cjs
      - run: node --test scripts/test-erp-reference-batches.cjs scripts/test-erp-reference-ui.cjs scripts/test-user-duplicate-check.cjs
      - run: node --test scripts/test-erp-export.cjs
      - run: node --test scripts/test-apt-analitica.cjs
      - run: node scripts/test-apt-begin.cjs
      - run: node scripts/test-apt-fifo.cjs
      - run: node scripts/test-apt-family.cjs
      - run: node scripts/test-apt-almacenes.cjs
      - run: node scripts/test-apt-gantt.cjs
      - run: node scripts/test-apt-operational.cjs
      - run: node scripts/test-apt-operations.cjs
      - run: node scripts/test-apt-recovery.cjs
      - run: node scripts/test-apt-operational-report.cjs
      - run: node scripts/test-apt-readiness.cjs
      - run: node scripts/test-apt-ai.cjs
      - run: node --test scripts/test-jrm-ai-knowledge.cjs
      - run: node --test scripts/test-jrm-ai-orchestration.cjs
      - run: node scripts/test-request-attention.cjs
      - run: node scripts/test-request-inline-components.cjs
      - run: node --test scripts/test-request-ot-picker.cjs
      - run: node scripts/test-request-ot-catalog.cjs
      - run: node scripts/test-request-reference.mjs
      - run: node scripts/test-reference-service-registry.cjs
      - run: node scripts/test-reference-finance.cjs
      - run: node scripts/test-public-tracking-session.cjs
      - run: node scripts/test-tracking-presence.cjs
      - run: node scripts/test-driver-trip-transaction.cjs
      - run: node scripts/test-delivery-conformity.cjs
      - name: PDF verification tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: node scripts/test-preuse.cjs
      - run: node scripts/test-dispatch-auditor.cjs
      - run: node scripts/test-request-schedule.cjs
      - run: node scripts/test-fleet-filters.cjs
      - run: node scripts/test-responsible-notifications.cjs
      - run: node scripts/test-driver-presence.cjs
      - run: node scripts/test-delivery-offline.cjs
      - run: node scripts/test-delivery-api.cjs
      - run: node scripts/test-production-security.cjs
      - run: node scripts/test-security-api.cjs
      - run: node scripts/test-security-workbooks.cjs
      - run: npm run check:guards
      - run: npm run typecheck

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - run: mkdir -p android/app/src/main/assets
      - run: npx cap sync android
      - name: Compile APK and test native session lock
        working-directory: android
        run: |
          set +e
          bash ./gradlew assembleDebug testDebugUnitTest --no-daemon > gradle-validation.log 2>&1
          result=$?
          cat gradle-validation.log
          if [ "$result" -ne 0 ]; then
            python - <<'PYTHON'
          from pathlib import Path
          message = '\n'.join(Path('gradle-validation.log').read_text().splitlines()[-100:])
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Android validation::' + message)
          import xml.etree.ElementTree as ET
          for file in Path('app/build/test-results/testDebugUnitTest').glob('*.xml'):
              for case in ET.parse(file).iter('testcase'):
                  for failure in case.findall('failure'):
                      detail = (failure.text or '')[:3500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=' + case.get('name', 'Native test') + '::' + detail)
          PYTHON
          fi
          exit "$result"
      - name: Native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-session-test-reports
          path: |
            android/gradle-validation.log
            android/app/build/test-results/testDebugUnitTest/*.xml
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
